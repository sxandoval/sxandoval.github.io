<script>
(() => {

  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  function planks() {

    for (let y = 0; y < 1024; y += 64) for (let x = -(y % 128 ? 160 : 0); x < 1024; x += 320) {
      const v = 120 + rnd() * 40; g.fillStyle = `rgb(${v + 40},${v - 5},${v - 45})`; g.fillRect(x, y, 318, 62);

  add(new THREE.BoxGeometry(0.2, 1.0, 3.8), wallM, 0, 0.5, 0, side); add(new THREE.BoxGeometry(0.2, 0.9, 3.8), wallM, 0, 3.55, 0, side);
  add(new THREE.BoxGeometry(0.24, 0.08, 3.8), std(0x1c1a22, 0.5), 0.02, 1.0, 0, side);     // sill
  add(new THREE.BoxGeometry(0.06, 2.1, 0.06), std(0x1c1a22, 0.5), 0, 2.05, 0, side);       // mullion

    g.fillStyle = "rgba(255,255,255,0.9)"; for (let i = 0; i < 60; i++) g.fillRect(rnd() * 1024, rnd() * 200, 1.5, 1.5);
    return tex(c);
  }
  const view = add(new THREE.PlaneGeometry(4.2, 2.6), new THREE.MeshBasicMaterial({ map: city() }), -W / 2 - 0.6, 2.1, 0); view.rotation.y = Math.PI / 2; view.castShadow = false;
  // rug
  const [rc, rg] = cnv(512, 512); rg.fillStyle = "#6e2a30"; rg.beginPath(); rg.roundRect(6, 6, 500, 500, 40); rg.fill();
  rg.strokeStyle = "#e7c9a0"; rg.lineWidth = 8; rg.beginPath(); rg.roundRect(34, 34, 444, 444, 26); rg.stroke();
  rg.fillStyle = "rgba(231,201,160,0.5)"; for (let i = 0; i < 9; i++) rg.fillRect(70, 80 + i * 42, 372, 6);
  const rug = add(new THREE.PlaneGeometry(3.2, 3.2), new THREE.MeshStandardMaterial({ map: tex(rc), transparent: true, roughness: 1 }), 0.4, 0.005, 0.6); rug.rotation.x = -Math.PI / 2;

  // --- furniture: couch, desk + monitor + chair, ring light, camera on a tripod, a lit Christmas tree, a 10K plaque
  const couch = new THREE.Group(); couch.position.set(1.6, 0, -2.75); scene.add(couch);
  const fabric = std(0x2a3550, 0.95);
  add(new THREE.BoxGeometry(2.6, 0.45, 0.95), fabric, 0, 0.32, 0, couch); add(new THREE.BoxGeometry(2.6, 0.75, 0.25), fabric, 0, 0.75, -0.36, couch);
  add(new THREE.BoxGeometry(0.25, 0.6, 0.95), fabric, -1.3, 0.45, 0, couch); add(new THREE.BoxGeometry(0.25, 0.6, 0.95), fabric, 1.3, 0.45, 0, couch);
  add(new THREE.BoxGeometry(0.5, 0.42, 0.14), std(0xff2b38, 0.9), -0.7, 0.72, -0.18, couch).rotation.z = 0.12;   // red pillow
  const desk = new THREE.Group(); desk.position.set(-2.6, 0, -2.6); scene.add(desk);
  const wood = std(0x3b2a1e, 0.6);
  add(new THREE.BoxGeometry(2.0, 0.06, 0.8), wood, 0, 0.76, 0, desk);
  for (const [x, z] of [[-0.95, -0.35], [0.95, -0.35], [-0.95, 0.35], [0.95, 0.35]]) add(new THREE.BoxGeometry(0.05, 0.76, 0.05), std(0x111111, 0.4, 0.6), x, 0.38, z, desk);
  const [mc, mg] = cnv(768, 432); const monTex = tex(mc);
  add(new THREE.BoxGeometry(1.1, 0.64, 0.04), std(0x0c0c0e, 0.4, 0.3), 0, 1.22, -0.18, desk);
  add(new THREE.PlaneGeometry(1.04, 0.585), new THREE.MeshBasicMaterial({ map: monTex, toneMapped: false }), 0, 1.22, -0.157, desk);
  add(new THREE.BoxGeometry(0.06, 0.3, 0.06), std(0x111111, 0.4, 0.6), 0, 0.92, -0.2, desk);
  add(new THREE.BoxGeometry(0.42, 0.03, 0.15), std(0x1a1a1d, 0.5), -0.1, 0.8, 0.12, desk);   // keyboard

  add(new THREE.CylinderGeometry(0.03, 0.03, 0.45, 8), std(0x333333, 0.3, 0.8), 0, 0.25, 0, chair);
  const ring = new THREE.Group(); ring.position.set(-0.6, 0, -2.4); scene.add(ring);
  add(new THREE.CylinderGeometry(0.02, 0.02, 1.7, 8), std(0x222222, 0.3, 0.8), 0, 0.85, 0, ring);
  const ringLight = add(new THREE.TorusGeometry(0.28, 0.035, 12, 48), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff3e0, emissiveIntensity: 2.2 }), 0, 1.85, 0, ring);
  ringLight.rotation.y = 0.5; ringLight.castShadow = false;
  const tri = new THREE.Group(); tri.position.set(3.4, 0, 0.6); scene.add(tri);
  for (let i = 0; i < 3; i++) { const l = add(new THREE.CylinderGeometry(0.015, 0.015, 1.3, 6), std(0x1d1d1f, 0.4, 0.6), Math.cos(i * 2.1) * 0.18, 0.63, Math.sin(i * 2.1) * 0.18, tri); l.rotation.set(Math.sin(i * 2.1) * 0.27, 0, -Math.cos(i * 2.1) * 0.27); }
  const cam3 = add(new THREE.BoxGeometry(0.28, 0.18, 0.16), std(0x141416, 0.4, 0.3), 0, 1.33, 0, tri);
  add(new THREE.CylinderGeometry(0.06, 0.06, 0.14, 20), std(0x0a0a0a, 0.2, 0.5), 0, 1.33, -0.14, tri).rotation.x = Math.PI / 2;
  const rec = add(new THREE.SphereGeometry(0.018, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff2b38 }), 0.1, 1.44, 0.03, tri);

  const pine = std(0x1d4a35, 0.9);
  [[0.75, 0.9, 0.6], [0.6, 0.8, 1.15], [0.42, 0.7, 1.62], [0.22, 0.5, 2.0]].forEach(([r, h, y]) => add(new THREE.ConeGeometry(r, h, 14), pine, 0, y, 0, tree));
  const bulbs = [];
  for (let i = 0; i < 46; i++) {
    const y = 0.45 + rnd() * 1.75, r = (2.25 - y) * 0.42 + 0.05, a = rnd() * 7;
    const col = [0xffb547, 0xff3b3b, 0xfff1d0, 0x6fb2ff][i % 4];
    const b = add(new THREE.SphereGeometry(0.035, 8, 8), new THREE.MeshBasicMaterial({ color: col }), Math.cos(a) * r, y, Math.sin(a) * r, tree); b.castShadow = false; bulbs.push(b);
  }

  // the views clock on the back wall (Daniel 2026-11-24: views move more than subs): seven-segment digits, like a digital clock, glowing red
  const [pc, pg] = cnv(2100, 420); const wallTex = tex(pc);
  add(new THREE.BoxGeometry(4.9, 1.05, 0.1), std(0x08080a, 0.35, 0.3), 0.3, 2.95, -D / 2 + 0.14);
  const wallScreen = add(new THREE.PlaneGeometry(4.74, 0.94), new THREE.MeshBasicMaterial({ map: wallTex, toneMapped: false }), 0.3, 2.95, -D / 2 + 0.195); wallScreen.castShadow = false;
  const wallGlow = new THREE.PointLight(0xff2b38, 0.9, 3.2, 2); wallGlow.position.set(0.3, 2.9, -D / 2 + 0.7); scene.add(wallGlow);

  function digit(g, x, y, w, h, ch, on, off) {

      f: () => V(L, (T + M) / 2, vl), b: () => V(R, (T + M) / 2, vl), e: () => V(L, (M + B) / 2, vl), c: () => V(R, (M + B) / 2, vl) };
    for (const k of "abcdefg") { const lit = ch !== " " && (SEG[ch] || "").includes(k); g.fillStyle = lit ? on : off; g.shadowColor = lit ? on : "transparent"; g.shadowBlur = lit ? 28 : 0; segs[k](); }

  // --- Daniel as a block figure: cylinder head with a cartoon of his face, his black cap, curls, earrings, shirtless six-pack

    g.fillStyle = "#c46a62"; g.beginPath(); g.ellipse(cx, 340, 34, 20, 0, 0, 7); g.fill();                                  // pursed lips, his face from the thumbnails
    g.strokeStyle = "#7a3330"; g.lineWidth = 5; g.beginPath(); g.moveTo(cx - 30, 340); g.quadraticCurveTo(cx, 350, cx + 30, 340); g.stroke();

  }
  // the ugly Christmas sweater (Daniel 2026-11-24): red knit, reindeer, snowflakes, zigzag bands, ribbed hem
  const RED = "#b51f2b", WHITE = "#f5efe4", GOLD = "#f0b43c";

  }
  function pix(g, x, y, s, rows, col) { g.fillStyle = col; rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === "#") g.fillRect(x + i * s, y + j * s, s, s); })); }

    const [c, g] = cnv(512, 512); knit(g, 512, 512, RED);

    for (let i = 0; i < 9; i++) pix(g, 14 + i * 56, 74, 5, FLAKE, i % 2 ? GOLD : WHITE);

    g.save(); g.translate(512, 0); g.scale(-1, 1); pix(g, 70, 150, 11, DEER, WHITE); g.restore();
    g.fillStyle = "#ff3b3b"; g.beginPath(); g.arc(70 + 1.5 * 11, 150 + 4 * 11, 9, 0, 7); g.fill();            // red noses
    g.beginPath(); g.arc(512 - 70 - 1.5 * 11, 150 + 4 * 11, 9, 0, 7); g.fill();

    zig(g, 318, 512, WHITE);

    g.fillStyle = "#8d1520"; g.fillRect(0, 420, 512, 92);                                // ribbed hem
    for (let x = 0; x < 512; x += 10) { g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(x, 420, 3, 92); }
    g.fillStyle = WHITE; g.fillRect(0, 446, 512, 10); g.fillRect(0, 474, 512, 10);

  }
  function knitTex(stripes) {
    const [c, g] = cnv(256, 256); knit(g, 256, 256, RED);
    if (stripes) { g.fillStyle = WHITE; g.fillRect(0, 60, 256, 16); g.fillRect(0, 180, 256, 16); for (let i = 0; i < 8; i++) pix(g, 8 + i * 32, 100, 4, FLAKE, WHITE); }
    const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
  }
  const knitM = new THREE.MeshStandardMaterial({ map: knitTex(true), roughness: 1 });
  const sleeveM = new THREE.MeshStandardMaterial({ map: knitTex(false), roughness: 1 });
  function capLogo() { const [c, g] = cnv(256, 256); g.fillStyle = "#17181c"; g.fillRect(0, 0, 256, 256); g.strokeStyle = "#3b3e48"; g.lineWidth = 14; g.strokeRect(46, 46, 164, 164); g.lineWidth = 10; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(98 + i * 30, 150, 26, Math.PI, 0); g.stroke(); } return tex(c); }

  const me = new THREE.Group(); scene.add(me);
  const body = new THREE.Group(); me.add(body);
  // torso: a tapered block (narrow shoulders, wider waist) with the six-pack printed on the front
  const tg = new THREE.BoxGeometry(0.62, 0.62, 0.34);
  { const p = tg.attributes.position; for (let i = 0; i < p.count; i++) if (p.getY(i) > 0) p.setX(i, p.getX(i) * 0.8); tg.computeVertexNormals(); }

  add(new THREE.CylinderGeometry(0.13, 0.15, 0.06, 24), new THREE.MeshStandardMaterial({ color: 0x8d1520, roughness: 1 }), 0, 1.345, 0, body);   // ribbed collar
  add(new THREE.CylinderGeometry(0.11, 0.11, 0.08, 20), skin, 0, 1.37, 0, body);                       // neck stud
  const head = new THREE.Group(); head.position.set(0, 1.41, 0); body.add(head);

  add(new THREE.SphereGeometry(0.25, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), skin, 0, 0.46, 0, head).scale.y = 0.3;
  const capM = std(0x17181c, 0.85);                                              // his black cap, brim forward
  add(new THREE.SphereGeometry(0.275, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), capM, 0, 0.42, 0, head).scale.y = 0.85;
  add(new THREE.CylinderGeometry(0.276, 0.276, 0.08, 40), capM, 0, 0.42, 0, head);
  const brim = add(new THREE.CylinderGeometry(0.21, 0.21, 0.025, 40, 1, false, 0, Math.PI), capM, 0, 0.4, 0.2, head); brim.scale.set(1.1, 1, 0.95); brim.rotation.set(0.12, -Math.PI / 2, 0);
  const logo = add(new THREE.PlaneGeometry(0.13, 0.13), new THREE.MeshStandardMaterial({ map: capLogo(), roughness: 0.85 }), 0, 0.55, 0.245, head); logo.rotation.x = -0.35;
  add(new THREE.SphereGeometry(0.022, 8, 8), std(0x2a2c33, 0.6), 0, 0.68, 0, head);   // button on top
  // hips + legs (black shorts), arms with C-hands
  const pants = std(0x1b1d24, 0.75);
  add(new THREE.BoxGeometry(0.62, 0.12, 0.32), pants, 0, 0.66, 0, body);
  const legs = [-1, 1].map(s => { const l = new THREE.Group(); l.position.set(s * 0.155, 0.6, 0); body.add(l); add(new THREE.BoxGeometry(0.29, 0.56, 0.32), pants, 0, -0.28, 0, l); add(new THREE.BoxGeometry(0.29, 0.1, 0.4), std(0x0f1014, 0.6), 0, -0.55, 0.04, l); return l; });
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.29, 1.27, 0); body.add(a);
    const u = add(new THREE.CylinderGeometry(0.075, 0.085, 0.42, 16), sleeveM, s * 0.06, -0.2, 0, a); u.rotation.z = s * 0.28;
    const cuff = add(new THREE.CylinderGeometry(0.088, 0.088, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0xf5efe4, roughness: 1 }), s * 0.115, -0.39, 0, a); cuff.rotation.z = s * 0.28;   // white cuff

  // ---------------- light ----------------
  scene.add(new THREE.HemisphereLight(0x9a8cc8, 0x2a2018, 1.15));
  const lamp = new THREE.SpotLight(0xffc98a, 1.25, 16, 1.05, 0.7, 1.6); lamp.position.set(2.2, 4.6, 2.4); lamp.target.position.set(0, 0, -0.8); scene.add(lamp.target);
  lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.002; scene.add(lamp);   // one shadow map instead of six

  // ---------------- orbit (drag), walk (tap floor), card (tap him) ----------------
  const target = new THREE.Vector3(0, 1.0, 0);
  let az = 0.3, el = 0.36, taz = az, tel = el, dist = 9.4, down = null;
  canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY, az: taz, el: tel, moved: 0 }; canvas.setPointerCapture(e.pointerId); });

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 62 : 45; camera.updateProjectionMatrix(); }

    camera.lookAt(target);

  // ---------------- live numbers: stats.json next to this page, refreshed hourly by GitHub ----------------
  async function pull() {
