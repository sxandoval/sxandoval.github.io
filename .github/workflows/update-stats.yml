name: Update live views
on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch channel stats from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          url = "https://www.googleapis.com/youtube/v3/channels?part=statistics&forHandle=Sxandovall&key=" + os.environ["YT_API_KEY"]
          s = json.load(urllib.request.urlopen(url))["items"][0]["statistics"]
          out = {"subs": int(s.get("subscriberCount", 0)), "views": int(s.get("viewCount", 0)), "videos": int(s.get("videoCount", 0)),
                 "updated": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="minutes")}
          old = json.load(open("stats.json"))
          if {k: old.get(k) for k in ("subs", "views", "videos")} != {k: out[k] for k in ("subs", "views", "videos")}:
              json.dump(out, open("stats.json", "w")); print("updated", out)
          else:
              print("no change", out)
          PY
      - name: Save
        run: |
          git config user.name "views-bot"; git config user.email "views-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "Update live views"
          git push
